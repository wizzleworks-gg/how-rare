name: Release

# Deliberate release trigger only — pushing a version tag (v1.2.3) or the manual
# "Run workflow" button. Plain pushes to a branch do NOT release; update the embedded
# AchievementRarity library and commit it before tagging (see README "Releasing").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag drives the version: stamp it into the TOC so the zip and the in-game
      # version match the tag. Manual dispatch (no tag) uses the TOC's own value.
      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            sed -i "s/^## Version:.*/## Version: ${V}/" HowRare/HowRare.toc
          else
            V="$(grep -m1 '^## Version:' HowRare/HowRare.toc | awk '{print $3}')"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${V}"

      - name: Build zip
        id: zip
        run: |
          set -euo pipefail
          OUT="$(scripts/release.sh)"
          echo "zip=${OUT}" >> "$GITHUB_OUTPUT"
          echo "Built ${OUT}"

      # Upload to CurseForge via its Upload API. Inert until both are configured,
      # so the scaffold can land before the CurseForge project exists:
      #   - secret  CF_API_KEY     (a CurseForge API token)
      #   - variable CF_PROJECT_ID (the numeric project id, public)
      - name: Upload to CurseForge
        id: upload
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_KEY:-}" ] || [ -z "${CF_PROJECT_ID:-}" ]; then
            echo "CF_API_KEY secret or CF_PROJECT_ID variable not set — built ${{ steps.zip.outputs.zip }} but skipping upload."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZIP="${{ steps.zip.outputs.zip }}"
          # One reported HTTP call: body to $2, status to stdout, and on a >=400 the
          # response body is printed before failing. curl's own -f swallows both the
          # status and the error document, so a rejected call surfaces as a bare
          # exit code with no cause; CurseForge answers with a JSON error object.
          cf_call() {  # $1 = label, $2 = body file, rest = curl args
            local label="$1" body="$2"
            shift 2
            local code
            code="$(curl -sS --connect-timeout 20 -m 180 -o "$body" -w '%{http_code}' "$@")" || {
              echo "error: ${label} — no HTTP response (connection failed or timed out)" >&2
              return 1
            }
            echo "${label}: HTTP ${code}"
            if [ "$code" -ge 400 ]; then
              echo "error: ${label} — CurseForge returned ${code}, body follows:" >&2
              cat "$body" >&2
              echo >&2
              return 1
            fi
          }

          # Map each TOC interface number (e.g. 120005 -> "12.0.5") to a
          # CurseForge game-version id from its versions endpoint.
          ifaces="$(grep -m1 '^## Interface:' HowRare/HowRare.toc | sed 's/^## Interface://' | tr ',' ' ')"
          cf_call "game versions" versions.json \
            -H "X-Api-Token: ${CF_API_KEY}" https://wow.curseforge.com/api/game/versions
          versions_json="$(cat versions.json)"
          ids='[]'
          for n in $ifaces; do
            n="$(echo "$n" | tr -cd '0-9')"
            [ -n "$n" ] || continue
            name="$((10#${n:0:2})).$((10#${n:2:2})).$((10#${n:4:2}))"
            id="$(echo "$versions_json" | jq -r --arg n "$name" 'map(select(.name==$n)) | .[0].id // empty')"
            if [ -n "$id" ]; then
              ids="$(echo "$ids" | jq --argjson id "$id" '. + [$id]')"
            else
              echo "warning: no CurseForge game version found for ${name}"
            fi
          done
          if [ "$(echo "$ids" | jq 'length')" -eq 0 ]; then
            echo "error: no CurseForge game versions resolved from ## Interface" >&2
            exit 1
          fi
          # Changelog = this version's CHANGELOG.md section (the block under its
          # "## <version>" heading, up to the next heading), with leading blank lines
          # trimmed. Falls back to "Release <version>" if no matching section exists.
          V="${{ steps.ver.outputs.version }}"
          notes="$(awk -v v="$V" '
            $0 ~ "^## \\[?" v "\\]?([^0-9.]|$)" { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md 2>/dev/null | sed -e '/./,$!d')"
          [ -n "$notes" ] || notes="Release ${V}"
          metadata="$(jq -nc --argjson gv "$ids" --arg cl "$notes" \
            '{changelog: $cl, changelogType: "markdown", releaseType: "release", gameVersions: $gv}')"
          # --form-string: metadata is passed literally — plain -F would parse
          # ;/@/< inside the changelog text as form options and mangle the JSON.
          cf_call "upload" upload.json \
            -H "X-Api-Token: ${CF_API_KEY}" \
            --form-string "metadata=${metadata}" \
            -F "file=@${ZIP}" \
            "https://wow.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file"
          cat upload.json
          echo
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          echo "Uploaded ${ZIP} to CurseForge project ${CF_PROJECT_ID}."

      - name: Notify
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
          UPLOADED: ${{ steps.upload.outputs.uploaded }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -uo pipefail
          [ -n "${NTFY_TOPIC:-}" ] || { echo "NTFY_TOPIC secret not set — no notification."; exit 0; }
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$JOB_STATUS" != "success" ]; then
            title="How Rare? release FAILED"; prio=high; tags=rotating_light
            body="v${V:-?} — ${run_url}"
          elif [ "$UPLOADED" = "true" ]; then
            title="How Rare? v${V} released"; prio=default; tags=package
            body="Uploaded to CurseForge"
          else
            title="How Rare? v${V} built, not uploaded"; prio=default; tags=warning
            body="CF_API_KEY / CF_PROJECT_ID not set on the repo. ${run_url}"
          fi
          printf '%s\n' "$body" | curl -fsS -m 10 \
            -H "Title: $title" -H "Priority: $prio" -H "Tags: $tags" \
            --data-binary "@-" "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null
